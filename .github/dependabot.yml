version: 2
updates:
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: daily
    time: "13:00"
    timezone: America/Los_Angeles
  open-pull-requests-limit: 10
  reviewers:
    - "JamesWTruher"
    - "bergmeister"
  ignore:
    - dependency-name: "System.Management.Automation"
    - dependency-name: "PowerShellStandard.Library"
- package-ecosystem: "github-actions"
  directory: "/"
  groups:
    github-actions:
      patterns: ["*"]
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
